<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230c2a20%22/%3E%3Cellipse cx=%2216%22 cy=%2216%22 rx=%2211%22 ry=%227%22 fill=%22%23fff%22 transform=%22rotate(-30 16 16)%22/%3E%3Cpath d=%22M11 10q-2 6 1 12M21 10q2 6-1 12%22 stroke=%22%23ffd23f%22 stroke-width=%222%22 fill=%22none%22 transform=%22rotate(-30 16 16)%22/%3E%3C/svg%3E">

<title>영상으로 보기 - 태그럭비</title>
<style>
/* ===== PLAYBOOK 공통 디자인 ===== */
:root{
  --turf-950:#071c15; --turf-900:#0c2a20; --turf-800:#123a2c; --turf-700:#175038; --turf-600:#1c6646; --turf-500:#2a8055;
  --paper:#f6f4ec; --card:#ffffff; --ink:#14201a; --muted:#56655c; --line:#e1e5da;
  --volt:#ffd23f; --volt-deep:#e6b400; --volt-soft:#fff6d1;
  --blue:#2563d9; --blue-soft:#e7eefc; --red:#df4a2f; --red-soft:#fdebe6;
  --ok:#15834a; --ok-soft:#e2f3e8; --foul:#d2372c; --foul-soft:#fce9e7;
  --display:"Black Han Sans","Pretendard",sans-serif;
  --fs:18px;
  --shadow:0 14px 34px -16px rgba(7,28,21,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
svg text{font-family:"Pretendard",sans-serif}
.dsp{font-family:var(--display);font-weight:400;letter-spacing:-.005em}

/* ---- 가로로 넘기는 카드 묶음 ---- */
.deck{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.rail{flex:none;display:flex;align-items:center;gap:14px;padding:6px 14px 6px 18px;background:var(--turf-900);color:#fff;min-height:52px}
.rail .ttl{font-weight:700;font-size:14px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.rail .segs{flex:1;display:flex;gap:4px;min-width:0}
.rail .seg{flex:1;min-width:0;height:40px;border:0;background:none;padding:0;position:relative}
.rail .seg::before{content:"";position:absolute;left:0;right:0;top:16px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);transition:background .3s}
.rail .seg.quiz::before{background:rgba(255,255,255,.28)}
.rail .seg.done::before{background:rgba(255,210,63,.45)}
.rail .seg.on::before{background:var(--volt);box-shadow:0 0 0 3px rgba(255,210,63,.25)}
.rail .count{font-family:var(--display);font-size:20px;color:var(--volt);min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.rail .fsz{display:flex;gap:4px}
.rail .fsz button{width:44px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font-weight:800}
.rail .fsz button:last-child{font-size:20px}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;min-height:0}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:24px 36px 96px;position:relative}
.ctrl{position:fixed;right:18px;bottom:16px;display:flex;gap:10px;z-index:20}
.ctrl button{width:58px;height:58px;border-radius:50%;border:0;background:var(--turf-900);color:#fff;box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s,opacity .2s}
.ctrl button:active{transform:scale(.94)}
.ctrl button.next{background:var(--volt);color:var(--turf-950)}
.ctrl button:disabled{opacity:.3;pointer-events:none}
.swipe-hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(12,42,32,.88);color:#fff;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;pointer-events:none;z-index:15;transition:opacity .5s}

/* ---- 카드 안 배치 ---- */
.split{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr);gap:36px;align-items:center;min-height:100%;max-width:1320px;margin:0 auto}
.split:has(> .txt:first-child),.split.text-first{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)}
.split.even{grid-template-columns:1fr 1fr}
.split.text-first .txt{order:-1}
.solo{max-width:900px;margin:0 auto}
.wide{max-width:1240px;margin:0 auto}
@media (max-width:900px),(orientation:portrait){
  .split,.split.even,.split:has(> .txt:first-child),.split.text-first{grid-template-columns:1fr;gap:22px;align-items:start;min-height:0}
  .split.text-first .txt{order:0}
  .slide{padding:22px 20px 112px}
  .rail .ttl{display:none}
}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--turf-600)}
.kicker b{font-family:var(--display);font-weight:400;background:var(--turf-900);color:var(--volt);border-radius:7px;padding:3px 9px 2px;font-size:15px;letter-spacing:0}
h1.big{font-family:var(--display);font-weight:400;font-size:clamp(40px,5.6vw,68px);line-height:1.1;margin:.25em 0 .3em;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.3vw,40px);line-height:1.22;margin:.3em 0 .5em}
h3{font-size:20px;margin:1em 0 .4em}
p,li{font-size:var(--fs);line-height:1.8}
p{margin:0 0 .8em}
.lead{font-size:calc(var(--fs) + 2px);color:var(--muted)}
.mark{background:linear-gradient(transparent 58%,rgba(255,210,63,.6) 58%);font-weight:700}
.rule{display:flex;gap:14px;align-items:flex-start;background:var(--volt-soft);border-left:6px solid var(--volt);padding:14px 18px;border-radius:0 14px 14px 0;margin:14px 0}
.rule .ico{flex:none;font-family:var(--display);font-size:15px;color:var(--turf-950);background:var(--volt);border-radius:6px;padding:2px 8px 1px;margin-top:4px}
.rule p{margin:0;font-weight:600}
.note{font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:15px}
.call{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:5px 14px;border-radius:999px;font-size:15px}
.call.ok{background:var(--ok-soft);color:var(--ok)}
.call.foul{background:var(--foul-soft);color:var(--foul)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;border:0;background:var(--turf-900);color:#fff;font-weight:800;font-size:17px;text-decoration:none;box-shadow:var(--shadow)}
.btn.volt{background:var(--volt);color:var(--turf-950)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}

/* ---- 그림 판 (잔디) ---- */
.vis{background:var(--turf-800);border-radius:24px;padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.vis svg.board{display:block;width:100%;height:auto;border-radius:14px}
.vis .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 4px 2px}
.vis .bar .grow{flex:1}
.vis .cap{color:#d5e3da;font-size:14px;line-height:1.5}
.vbtn{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.vbtn.on{background:var(--volt);color:var(--turf-950)}
.vis.paper{background:#fff;border:1px solid var(--line)}
.model-note{font-size:12.5px;color:rgba(255,255,255,.55);padding:6px 4px 0}
.vis.paper .model-note{color:var(--muted)}

/* ---- 퀴즈 ---- */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:0 8px 24px -18px rgba(0,0,0,.35);margin:0 0 18px}
.quiz .qn{font-family:var(--display);color:var(--turf-600);font-size:16px;display:flex;align-items:center;gap:8px}
.quiz .qn .src{font-family:"Pretendard";font-size:13px;font-weight:600;color:var(--muted)}
.quiz .q{font-size:calc(var(--fs) + 1px);font-weight:700;line-height:1.65;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:54px;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:600;display:flex;gap:12px;align-items:center;line-height:1.5;transition:border-color .2s,background .2s}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:#edf1ea;display:grid;place-items:center;font-family:var(--display);font-size:15px}
.opt:hover{border-color:#c9d3c4}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--foul);background:var(--foul-soft)}
.opt.wrong .k{background:var(--foul);color:#fff}
.opt[disabled]{cursor:default}
.opts.ox{grid-template-columns:1fr 1fr}
.opts.ox .opt{justify-content:center;font-family:var(--display);font-size:38px;min-height:88px}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.pics .opt{flex-direction:column;justify-content:flex-start;text-align:center;padding:10px;font-size:15px}
.opts.pics .opt svg{width:100%;height:auto;max-width:150px}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:16px;line-height:1.7;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--foul-soft)}
.fb b{font-weight:800}
.sentence{font-size:calc(var(--fs) + 1px);line-height:2.3;font-weight:600}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:92px;min-height:44px;border:0;border-bottom:3px solid var(--turf-500);background:#f1f5ef;border-radius:8px 8px 0 0;padding:0 10px;font-weight:800;color:var(--turf-700);vertical-align:middle;margin:0 2px}
.blank.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.wrong{background:var(--foul-soft);border-color:var(--foul);color:var(--foul)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:16px}
.chip.used{opacity:.35}
.scorebox{background:#0b120f;color:#fff;border-radius:22px;padding:22px 26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;box-shadow:var(--shadow)}
.scorebox .digits{font-family:var(--display);font-size:76px;line-height:1;color:var(--volt);font-variant-numeric:tabular-nums}
.scorebox .digits small{font-size:34px;color:rgba(255,255,255,.5)}
.scorebox .lbl{font-weight:700;color:rgba(255,255,255,.7);font-size:15px}
.scorebox .msg{font-size:18px;font-weight:700;margin-top:4px}
.review{display:grid;gap:8px;margin-top:14px}
.review button{min-height:48px;text-align:left;border-radius:12px;border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:600;font-size:15px}

/* ---- 용어 풀이 ---- */
.term{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700;border-bottom:2px dotted var(--turf-500);cursor:help}
.gloss{position:fixed;z-index:50;max-width:300px;background:var(--turf-950);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.6;box-shadow:var(--shadow)}
.gloss b{color:var(--volt);display:block;font-size:14px;margin-bottom:2px}

/* ---- 등장 효과 (내용을 숨기지 않음) ---- */
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
.slide.enter .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.slide.enter .rise.d1{animation-delay:.08s}.slide.enter .rise.d2{animation-delay:.16s}.slide.enter .rise.d3{animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- 오류 상자 ---- */
#errbox{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#b3261e;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;display:none;box-shadow:var(--shadow)}

body{background:var(--turf-950);color:#fff;overflow:hidden}
.page{position:fixed;inset:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:6px 16px 6px 18px;min-height:52px;background:var(--turf-900);border-bottom:1px solid rgba(255,255,255,.06)}
.top .ttl{font-weight:700;font-size:14px;color:rgba(255,255,255,.72);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sc{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:13px;color:rgba(255,255,255,.6)}
.top .sc b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--volt);font-variant-numeric:tabular-nums}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:16px 18px}
.left{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.6vw,32px);margin:0;line-height:1.2}
.vhead .ch{font-size:14px;color:rgba(255,255,255,.6);font-weight:600}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.vwrap{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -20px #000}
@supports (aspect-ratio:16/9){.vwrap{height:auto;max-width:calc((100vh - 250px) * 16 / 9)}}
.vwrap iframe,.vwrap #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cue{position:absolute;inset:0;background:rgba(7,28,21,.93);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto;z-index:3}
.cue.on{display:flex}
.cue .card{width:100%;max-width:680px;color:#fff}
.cue .stamp{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--turf-950);background:var(--volt);border-radius:999px;padding:4px 12px}
.cue .q{font-size:clamp(18px,2vw,23px);font-weight:800;line-height:1.55;margin:12px 0 14px}
.cue .opts .opt{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#fff}
.cue .opts .opt .k{background:rgba(255,255,255,.14);color:#fff}
.cue .opts .opt.right{background:rgba(21,131,74,.35);border-color:#3fcf7f}
.cue .opts .opt.wrong{background:rgba(210,55,44,.3);border-color:#ff7d70}
.cue .fb{color:var(--ink)}
.cue .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cue .acts .btn{min-height:48px;font-size:16px}
.tl{flex:none;position:relative;height:44px;margin:0 6px}
.tl .bar{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.tl .fill{position:absolute;left:0;top:19px;height:6px;border-radius:3px;background:var(--volt);width:0}
.tl .pin{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:50%;border:3px solid var(--turf-950);background:#fff;color:var(--turf-950);font-family:var(--display);font-size:13px;display:grid;place-items:center;padding:0}
.tl .pin.done{background:#3fcf7f}
.tl .pin.miss{background:#ffb4a6}
.tl .lab{position:absolute;right:0;top:-2px;font-size:12px;color:rgba(255,255,255,.5);font-weight:700}
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.side h2{font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.55);margin:2px 0 2px;font-family:"Pretendard";font-weight:800}
.vcard{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.05);color:#fff;min-height:80px}
.vcard.on{border-color:var(--volt);background:rgba(255,210,63,.08)}
.vcard .th{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#123}
.vcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .th .no{position:absolute;left:6px;top:6px;font-family:var(--display);font-size:14px;background:var(--volt);color:var(--turf-950);border-radius:6px;padding:1px 7px}
.vcard .th .len{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.75);border-radius:4px;padding:1px 5px}
.vcard .t{font-weight:800;font-size:15px;line-height:1.35}
.vcard .m{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px}
.vcard .dots{display:flex;gap:4px;margin-top:6px}
.vcard .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2)}
.vcard .dots i.done{background:#3fcf7f}
.vcard .dots i.miss{background:#ffb4a6}
.howto{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.65);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px}
.howto b{color:var(--volt)}
.side .btn{min-height:46px;font-size:15px;box-shadow:none}
.side .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.2)}
.list{position:fixed;inset:52px 0 0 0;background:var(--paper);color:var(--ink);overflow-y:auto;padding:24px 20px 60px;display:none;z-index:10}
.list.on{display:block}
.list .solo h2{color:var(--ink)}
.notice{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:#0b120f;z-index:2}
.notice.on{display:flex}
@media (max-width:900px),(orientation:portrait){
  body{overflow:auto}
  .page{position:static;min-height:100%}
  .main{grid-template-columns:1fr;padding:14px}
  .vwrap{max-width:none}
  .stage{flex:none}
  .side{overflow:visible}
  .vcard{grid-template-columns:150px 1fr}
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="ttl">01 영상으로 보기 · 대한럭비협회 공식 영상</div>
    <div class="sc">맞힌 문제 <b id="score">0 / 0</b></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="vhead"><h1 id="vTitle">영상</h1><span class="ch" id="vCh"></span></div>
      <div class="stage">
        <div class="vwrap">
          <div id="yt"></div>
          <div class="notice" id="notice"><div><p style="font-size:18px;font-weight:700">영상을 불러오지 못했어요.</p><p style="color:rgba(255,255,255,.7);font-size:15px">학교 인터넷에서 유튜브가 막혀 있을 수 있어요.<br>오른쪽 아래 <b>「문제만 풀기」</b>로 같은 문제를 풀 수 있어요.</p></div></div>
          <div class="cue" id="cue"><div class="card" id="cueCard"></div></div>
        </div>
      </div>
      <div class="tl" id="tl"><div class="bar"></div><div class="fill" id="tlFill"></div><div class="lab" id="tlLab"></div></div>
    </div>
    <aside class="side">
      <h2>영상 목록</h2>
      <div id="vlist" style="display:grid;gap:10px"></div>

<script>
/* ===== PLAYBOOK 공통 스크립트: 오류 상자, 이동, 카드 넘김, 퀴즈, 용어 풀이 ===== */
(function(){
  var shown = [];
  window.PE_ERR = function(e, where){
    try{
      var box = document.getElementById('errbox');
      if(!box){ box = document.createElement('div'); box.id = 'errbox'; document.body.appendChild(box); }
      var msg = (where ? '[' + where + '] ' : '') + (e && e.message ? e.message : String(e));
      if(shown.indexOf(msg) > -1) return;
      shown.push(msg);
      box.style.display = 'block';
      box.innerHTML = '<b>화면 일부가 제대로 열리지 않았어요.</b> 새로고침해 보고, 계속되면 선생님께 알려 주세요.<br><small>' + shown.join('<br>').replace(/</g,'&lt;') + '</small>';
    }catch(_){}
  };
  window.addEventListener('error', function(ev){ PE_ERR(ev.error || ev.message, '페이지'); });
})();

window.PE = window.PE || {};

/* 탭 껍데기로 이동 요청 */
PE.nav = function(target){
  try{ if(window.parent && window.parent !== window) window.parent.postMessage({type:'pe-nav', target:target}, '*'); }catch(e){}
};
document.addEventListener('click', function(ev){
  var a = ev.target.closest && ev.target.closest('[data-nav]');
  if(a){ ev.preventDefault(); PE.nav(a.getAttribute('data-nav')); }
});

PE.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- 카드 넘김 ---- */
PE.deck = function(root){
  var track = root.querySelector('.track');
  var slides = Array.prototype.slice.call(track.children);
  var segs = root.querySelector('.segs');
  var count = root.querySelector('.count');
  var prev = root.querySelector('.ctrl .prev'), next = root.querySelector('.ctrl .next');
  var idx = -1, seen = {}, listeners = [];
  var ttl = root.querySelector('.rail .ttl'); if(ttl) ttl.textContent = root.dataset.title || '';
  slides.forEach(function(s, i){
    var b = document.createElement('button');
    b.className = 'seg' + (s.classList.contains('is-quiz') ? ' quiz' : '');
    b.setAttribute('aria-label', (i+1) + '번째 카드' + (s.dataset.title ? ': ' + s.dataset.title : ''));
    b.onclick = function(){ go(i); };
    segs.appendChild(b);
  });
  var segEls = segs.children;
  function go(i, smooth){
    i = Math.max(0, Math.min(slides.length - 1, i));
    track.scrollTo({left: i * track.clientWidth, behavior: (smooth === false || PE.reduce) ? 'auto' : 'smooth'});
  }
  function update(){
    var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    if(i === idx) return;
    idx = i; seen[i] = true;
    slides.forEach(function(s, k){ s.classList.toggle('enter', k === i); s.toggleAttribute('inert', false); });
    for(var k = 0; k < segEls.length; k++){
      segEls[k].classList.toggle('on', k === i);
      segEls[k].classList.toggle('done', !!seen[k] && k !== i);
    }
    count.textContent = (i+1) + ' / ' + slides.length;
    prev.disabled = i === 0; next.disabled = i === slides.length - 1;
    listeners.forEach(function(fn){ try{ fn(i, slides[i]); }catch(e){ PE_ERR(e, '카드 넘김'); } });
  }
  var raf = 0;
  track.addEventListener('scroll', function(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }, {passive:true});
  prev.onclick = function(){ go(idx - 1); };
  next.onclick = function(){ go(idx + 1); };
  window.addEventListener('resize', function(){ var k = idx; idx = -1; go(k, false); setTimeout(update, 60); });
  document.addEventListener('keydown', function(e){
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ go(idx + 1); e.preventDefault(); }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(idx - 1); e.preventDefault(); }
  });
  var fsz = root.querySelectorAll('.fsz button');
  var sizes = [16, 18, 20, 22], si = 1;
  try{ si = +(localStorage.getItem('pe-fs') || 1); }catch(e){}
  function applyFs(){ document.documentElement.style.setProperty('--fs', sizes[si] + 'px'); try{ localStorage.setItem('pe-fs', si); }catch(e){} }
  if(fsz.length === 2){
    fsz[0].onclick = function(){ si = Math.max(0, si - 1); applyFs(); };
    fsz[1].onclick = function(){ si = Math.min(sizes.length - 1, si + 1); applyFs(); };
  }
  applyFs();
  var hint = root.querySelector('.swipe-hint');
  if(hint){ setTimeout(function(){ hint.style.opacity = 0; }, 3800); }
  setTimeout(update, 30);
  return {
    go: go,
    slides: slides,
    get idx(){ return idx; },
    onChange: function(fn){ listeners.push(fn); },
    indexOf: function(el){ var s = el.closest('.slide'); return slides.indexOf(s); }
  };
};

/* ---- 퀴즈 ----
   QUIZ = { id: {type:'mc'|'ox'|'pics'|'chips', q, opts, a, ex, src} }
   <div class="quiz" data-q="id"></div> 자리에 그린다. 첫 번째 답만 점수에 넣는다. */
PE.quiz = function(QUIZ, opt){
  opt = opt || {};
  var state = {}; // id -> {first:true/false}
  var order = [];
  var nums = {};
  var holders = document.querySelectorAll('.quiz[data-q]');
  Array.prototype.forEach.call(holders, function(h, n){
    var id = h.getAttribute('data-q'), d = QUIZ[id];
    if(!d){ h.textContent = '문제 데이터 없음: ' + id; return; }
    order.push(id); nums[id] = order.length;
    var head = '<div class="qn">문제 ' + order.length + (d.src ? ' <span class="src">' + d.src + '</span>' : '') + '</div>';
    var q = '<div class="q">' + d.q + '</div>';
    h.innerHTML = head + q;
    var fb = document.createElement('div'); fb.className = 'fb';
    function done(ok){
      if(!(id in state)) state[id] = ok;
      fb.className = 'fb show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '<b>정답이에요.</b> ' : '<b>다시 생각해 봐요.</b> ') + (d.ex || '');
      if(opt.onAnswer) opt.onAnswer(id, ok, state);
    }
    if(d.type === 'chips'){
      var parts = d.q.split(/\[\[(\d+)\]\]/);
      var sent = document.createElement('div'); sent.className = 'sentence';
      var blanks = [];
      h.querySelector('.q').remove();
      parts.forEach(function(p, i){
        if(i % 2 === 0){ sent.appendChild(document.createTextNode(p)); return; }
        var b = document.createElement('button'); b.className = 'blank'; b.textContent = ' ';
        b.setAttribute('aria-label', '빈칸'); b._val = null;
        b.onclick = function(){ if(b._val == null || b.classList.contains('right')) return; b._chip.classList.remove('used'); b._val = null; b.textContent = ' '; b.classList.remove('wrong'); };
        blanks.push(b); sent.appendChild(b);
      });
      h.appendChild(sent);
      var chips = document.createElement('div'); chips.className = 'chips';
      d.chips.forEach(function(c){
        var cb = document.createElement('button'); cb.className = 'chip'; cb.textContent = c;
        cb.onclick = function(){
          if(cb.classList.contains('used')) return;
          var empty = blanks.filter(function(b){ return b._val == null; })[0];
          if(!empty) return;
          empty._val = c; empty._chip = cb; empty.textContent = c; cb.classList.add('used');
          if(blanks.every(function(b){ return b._val != null; })){
            var ok = blanks.every(function(b, i){ return b._val === d.a[i]; });
            blanks.forEach(function(b, i){ b.classList.toggle('right', b._val === d.a[i]); b.classList.toggle('wrong', b._val !== d.a[i]); });
            done(ok);
          }
        };
        chips.appendChild(cb);
      });
      h.appendChild(chips);
    } else {
      var box = document.createElement('div');
      var opts = d.type === 'ox' ? ['O', 'X'] : d.opts;
      box.className = 'opts' + (d.type === 'ox' ? ' ox' : '') + (d.type === 'pics' ? ' pics' : '') + (d.two ? ' two' : '');
      opts.forEach(function(o, i){
        var b = document.createElement('button'); b.className = 'opt';
        b.innerHTML = (d.type === 'ox' ? '' : '<span class="k">' + (i+1) + '</span>') + '<span>' + o + '</span>';
        b.onclick = function(){
          var ans = d.type === 'ox' ? (d.a ? 0 : 1) : d.a;
          var ok = i === ans;
          b.classList.add(ok ? 'right' : 'wrong');
          if(ok){ Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; }); }
          done(ok);
        };
        box.appendChild(b);
      });
      h.appendChild(box);
    }
    h.appendChild(fb);
  });
  return {
    order: order,
    state: state,
    nums: nums,
    score: function(){ var s = 0; order.forEach(function(id){ if(state[id] === true) s++; }); return s; },
    answered: function(){ return order.filter(function(id){ return id in state; }).length; }
  };
};

/* 결과 칸 그리기 */
PE.renderScore = function(el, quiz, deck, msgs){
  var n = quiz.order.length, s = quiz.score(), a = quiz.answered();
  var msg = a < n ? '아직 ' + (n - a) + '문제를 풀지 않았어요.' : (s === n ? msgs[0] : s >= n * 0.6 ? msgs[1] : msgs[2]);
  var wrong = quiz.order.filter(function(id){ return quiz.state[id] === false; });
  var html = '<div class="scorebox"><div><div class="lbl">맞힌 문제</div><div class="digits">' + s + '<small> / ' + n + '</small></div></div><div style="flex:1;min-width:200px"><div class="msg">' + msg + '</div></div></div>';
  if(wrong.length){
    html += '<div class="review">' + wrong.map(function(id){
      var h = document.querySelector('.quiz[data-q="' + id + '"]');
      var label = '틀린 문제 ' + quiz.nums[id] + ' 다시 보기';
      return '<button data-go="' + deck.indexOf(h) + '">' + label + ' →</button>';
    }).join('') + '</div>';
  }
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll('[data-go]'), function(b){ b.onclick = function(){ deck.go(+b.dataset.go); }; });
};

/* ---- 용어 풀이 ---- */
PE.glossary = function(G){
  var pop = null;
  function close(){ if(pop){ pop.remove(); pop = null; } }
  document.addEventListener('click', function(ev){
    var t = ev.target.closest && ev.target.closest('.term');
    close();
    if(!t) return;
    var key = t.dataset.t || t.textContent.trim();
    if(!G[key]) return;
    pop = document.createElement('div'); pop.className = 'gloss';
    pop.innerHTML = '<b>' + key + '</b>' + G[key];
    document.body.appendChild(pop);
    var r = t.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var x = Math.min(window.innerWidth - pw - 10, Math.max(10, r.left + r.width / 2 - pw / 2));
    var y = r.bottom + 8; if(y + ph > window.innerHeight - 10) y = r.top - ph - 8;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
    ev.stopPropagation();
  });
  document.addEventListener('scroll', close, true);
};

</script>

      return '<button class="vcard' + (i === cur ? ' on' : '') + '" data-v="' + i + '"><div class="th"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg"><span class="no">' + (i+1) + '</span><span class="len">' + v.len + '</span></div><div><div class="t">' + v.title + '</div><div class="m">' + v.ch + '</div><div class="dots">' + dots + '</div></div></button>';
    }).join('');
    Array.prototype.forEach.call(vlist.querySelectorAll('[data-v]'), function(b){ b.onclick = function(){ load(+b.dataset.v); }; });
  }
  function drawPins(){
    var v = VIDEOS[cur], tl = document.getElementById('tl'), dur = durOf(v);
    Array.prototype.forEach.call(tl.querySelectorAll('.pin'), function(p){ p.remove(); });
    v.cues.forEach(function(c, j){
      var p = document.createElement('button'); var r = R[key(cur, j)];
      p.className = 'pin' + (r === true ? ' done' : r === false ? ' miss' : '');
      p.style.left = (c.t / dur * 100) + '%'; p.textContent = j + 1;
      p.setAttribute('aria-label', (j+1) + '번 문제 장면으로');
      p.onclick = function(){ if(ready){ player.seekTo(c.back, true); player.playVideo(); } };
      tl.appendChild(p);
    });
  }
  function durOf(v){ var d = ready && player.getDuration ? player.getDuration() : 0; if(d > 0) return d; var m = v.len.split(':'); return +m[0] * 60 + +m[1]; }
  function load(i){
    cur = i; var v = VIDEOS[i];
    document.getElementById('vTitle').textContent = (i+1) + '. ' + v.title;
    document.getElementById('vCh').textContent = v.ch + ' · ' + v.len;
    hideCue();
    if(ready) player.cueVideoById({videoId:v.id, startSeconds:0});
    drawList(); drawPins();
  }
  function hideCue(){ document.getElementById('cue').classList.remove('on'); open = null; }
  function showCue(j){
    var v = VIDEOS[cur], c = v.cues[j], k = key(cur, j);
    open = j;
    if(ready) player.pauseVideo();
    var card = document.getElementById('cueCard');
    card.innerHTML = '<span class="stamp">' + fmt(c.t) + ' · 문제 ' + (j+1) + ' / ' + v.cues.length + '</span><div class="q">' + c.q + '</div><div class="opts"></div><div class="fb"></div><div class="acts"></div>';
    var box = card.querySelector('.opts'), fb = card.querySelector('.fb'), acts = card.querySelector('.acts');
    c.opts.forEach(function(o, n){
      var b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = '<span class="k">' + (n+1) + '</span><span>' + o + '</span>';
      b.onclick = function(){
        var ok = n === c.a;
        if(!(k in R)) R[k] = ok;
        b.classList.add(ok ? 'right' : 'wrong');
        fb.className = 'fb show ' + (ok ? 'ok' : 'no');
        fb.innerHTML = (ok ? '<b>정답이에요.</b> ' : '<b>아쉬워요.</b> ') + (c.ex || '');
        acts.innerHTML = '';
        if(ok){
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          c._pass = true;
          var go = document.createElement('button'); go.className = 'btn volt'; go.textContent = '이어서 보기 ▶';
          go.onclick = function(){ hideCue(); if(ready) player.playVideo(); };
          acts.appendChild(go);
        } else {
          var back = document.createElement('button'); back.className = 'btn volt'; back.textContent = '그 장면 다시 보기 (' + fmt(c.back) + '부터)';
          back.onclick = function(){ hideCue(); if(ready){ player.seekTo(c.back, true); player.playVideo(); } };
          acts.appendChild(back);
        }
        score(); drawList(); drawPins();
      };
      box.appendChild(b);
    });
    document.getElementById('cue').classList.add('on');
  }
  function poll(){
    if(!ready || !player.getCurrentTime) return;
    var v = VIDEOS[cur], t = player.getCurrentTime(), dur = durOf(v);
    document.getElementById('tlFill').style.width = Math.min(100, t / dur * 100) + '%';
    document.getElementById('tlLab').textContent = fmt(t) + ' / ' + fmt(dur);
    if(open != null) return;
    var st = player.getPlayerState();
    if(st !== 1) return;
    for(var j = 0; j < v.cues.length; j++){
      var c = v.cues[j];
      if(!c._pass && t >= c.t){ showCue(j); break; }
    }
  }
  window.onYouTubeIframeAPIReady = function(){
    try{
      player = new YT.Player('yt', {
        videoId: VIDEOS[cur].id,
        playerVars: {rel:0, playsinline:1, modestbranding:1, hl:'ko', cc_lang_pref:'ko'},
        events: {
          onReady: function(){ ready = true; drawPins(); tick = setInterval(poll, 250); },
          onError: function(){ document.getElementById('notice').classList.add('on'); },
          onStateChange: function(e){
            if(e.data === 0 && cur < VIDEOS.length - 1){
              var card = document.getElementById('cueCard');
              card.innerHTML = '<span class="stamp">영상 끝</span><div class="q">' + VIDEOS[cur].title + ' 영상을 다 봤어요.</div><div class="acts"><button class="btn volt" id="nextV">다음 영상: ' + VIDEOS[cur+1].title + ' ▶</button></div>';
              document.getElementById('cue').classList.add('on'); open = -1;
              document.getElementById('nextV').onclick = function(){ load(cur + 1); hideCue(); setTimeout(function(){ player.playVideo(); }, 400); };
            }
          }
        }
      });
    }catch(e){ PE_ERR(e, '유튜브'); }
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function(){ document.getElementById('notice').classList.add('on'); };
  document.head.appendChild(s);
  setTimeout(function(){ if(!ready) document.getElementById('notice').classList.add('on'); }, 9000);
  load(0); score();

  /* 문제만 풀기 */
  document.getElementById('listBtn').onclick = function(){
    var Q = {}, html = '';
    VIDEOS.forEach(function(v, i){
      html += '<h3>' + (i+1) + '. ' + v.title + ' <span class="note">' + v.ch + '</span></h3>';
      v.cues.forEach(function(c, j){
        Q['v' + i + 'c' + j] = {type:'mc', src:fmt(c.t), q:c.q, opts:c.opts, a:c.a, ex:c.ex};
        html += '<div class="quiz" data-q="v' + i + 'c' + j + '"></div>';
      });
    });
    var host = document.getElementById('listQ'); host.innerHTML = html;
    PE.quiz(Q, {onAnswer:function(id, ok){ var m = id.match(/v(\d+)c(\d+)/), k = key(+m[1], +m[2]); if(!(k in R)) R[k] = ok; if(ok) VIDEOS[+m[1]].cues[+m[2]]._pass = true; score(); drawList(); drawPins(); }});
    document.getElementById('list').classList.add('on');
    if(ready) player.pauseVideo();
  };
  document.getElementById('listClose').onclick = function(){ document.getElementById('list').classList.remove('on'); };
}catch(e){ PE_ERR(e, '영상'); }
</script>
</body>
</html>
