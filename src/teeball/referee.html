<!DOCTYPE html>
<html lang="ko">
<head>
<!--@@KIT:head.html@@-->
<title>내가 심판 - 티볼</title>
<style>
/*@@KIT:base.css@@*/
body{background:var(--turf-950);color:#fff;overflow:hidden}
.page{position:fixed;inset:0;display:flex;flex-direction:column}
.sb{flex:none;display:flex;align-items:stretch;gap:2px;background:#0a0f0d;min-height:58px}
.sb .ttl{display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:14px;color:rgba(255,255,255,.72);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .cell{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 18px;background:#111a16;min-width:96px}
.sb .cell small{font-size:11px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.5)}
.sb .cell b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;color:var(--volt);font-variant-numeric:tabular-nums}
.prog{display:flex;gap:4px;align-items:center;padding:0 14px;background:#111a16}
.prog i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.15)}
.prog i.on{outline:2px solid var(--volt);outline-offset:1px}
.prog i.ok{background:#3fcf7f}
.prog i.no{background:#ff7d70}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:14px 16px}
.left{min-height:0;display:flex;flex-direction:column;justify-content:center}
.left .vis{padding:10px}
.left svg.board{max-height:calc(100vh - 245px)}
.scnHead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.scnHead .no{font-family:var(--display);background:var(--volt);color:var(--turf-950);border-radius:8px;padding:3px 10px 2px;font-size:18px}
.scnHead h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,30px);margin:0;line-height:1.2}
.speed{font-size:13px;color:rgba(255,255,255,.6);font-weight:700}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.box{background:rgba(255,255,255,.05);border-radius:18px;padding:16px 18px}
.box h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.55);font-weight:800}
.ask{font-size:19px;font-weight:800;line-height:1.5;margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dec{min-height:76px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.dec small{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6)}
.dec.play{border-color:#3fcf7f}
.dec.whistle{border-color:#ff7d70}
.dec.sel{background:#fff;color:var(--ink)}
.dec.sel small{color:var(--muted)}
.dec:disabled{opacity:.35}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reasons button{min-height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font-weight:700;font-size:15px;padding:6px 10px;line-height:1.3}
.reasons button.sel{background:#fff;color:var(--ink)}
.result{background:#fff;color:var(--ink);border-radius:18px;padding:16px 18px}
.result .verdict{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.result .verdict .mark{font-family:var(--display);font-size:20px;background:none}
.result .verdict .mark.ok{color:var(--ok)} .result .verdict .mark.no{color:var(--foul)}
.result .ans{font-weight:800;font-size:17px;padding:10px 14px;border-radius:12px;margin:8px 0}
.result .ans.ok{background:var(--ok-soft);color:var(--ok)} .result .ans.foul{background:var(--foul-soft);color:var(--foul)}
.result p{font-size:16px;line-height:1.7;margin:0 0 10px}
.result .acts{display:flex;gap:8px;flex-wrap:wrap}
.result .btn{min-height:48px;font-size:16px;box-shadow:none}
.final{position:fixed;inset:58px 0 0 0;background:var(--paper);color:var(--ink);overflow-y:auto;padding:28px 20px 60px;display:none;z-index:10}
.final.on{display:block}
.rank{font-family:var(--display);font-size:clamp(36px,5vw,56px);margin:.2em 0}
@media (max-width:900px),(orientation:portrait){
  body{overflow:auto}
  .page{position:static;min-height:100%}
  .main{grid-template-columns:1fr;padding:12px}
  .left svg.board{max-height:none}
  .sb .ttl{display:none}
  .prog{flex:1;flex-wrap:wrap;justify-content:center;padding:6px}
}
</style>
</head>
<body>
<div class="page">
  <div class="sb">
    <div class="ttl">04 내가 심판 · 장면을 보고 판정하기</div>
    <div class="prog" id="prog"></div>
    <div class="cell"><small>장면</small><b id="sNo">1 / 12</b></div>
    <div class="cell"><small>정확한 판정</small><b id="sOk">0</b></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="scnHead"><span class="no" id="hNo">1</span><h1 id="hTitle">장면</h1></div>
      <div class="vis">
        <svg id="pitch"></svg>
        <div class="bar">
          <button class="vbtn" id="bReplay">▶ 다시 보기</button>
          <button class="vbtn" id="bSlow">느리게 보기</button>
          <button class="vbtn" id="bMarks" disabled>판정선</button>
          <span class="grow"></span><span class="speed" id="spd"></span>
        </div>
        <div class="model-note" id="mNote">파랑은 공격(타자·주자), 빨강은 수비예요. 판정한 뒤에는 판정선으로 이유를 보여 줘요.</div>
      </div>
    </div>
    <aside class="panel">
      <div class="box" id="step1">
        <h3>1단계</h3>
        <p class="ask">이 장면, 심판이라면?</p>
        <div class="two">
          <button class="dec play" data-d="play">세이프 · 페어<small>경기 계속</small></button>
          <button class="dec whistle" data-d="foul">아웃 · 파울<small>휘슬을 불어요</small></button>
        </div>
      </div>
      <div class="box" id="step2" style="display:none">
        <h3>2단계</h3>
        <p class="ask">무엇 때문인가요?</p>
        <div class="reasons" id="reasons"></div>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </aside>
  </div>
</div>
<div class="final" id="final"><div class="solo" id="finalIn"></div></div>

<script>
/*@@KIT:kit.js@@*/
</script>
<script>
/*@@KIT:field.js@@*/
</script>

<script>
/* ===== 판정 종류와 장면 데이터 =====
   answer: null이면 세이프·페어(경기 계속), 아니면 REASONS의 키. view: 보여 줄 범위(m) */
var REASONS = {
  force:'포스아웃', tag:'태그아웃', fly:'플라이 아웃', strike:'스트라이크 아웃',
  early:'루반칙 (미리 출발)', slide:'슬라이딩', lane:'주로 이탈 (1 m)', foul:'파울'
};
var D = 18.29, r = D * Math.SQRT1_2;
var B1 = [r, -r], B2 = [0, -2*r], B3 = [-r, -r], BH = [0, 0], BAT = [-1.3, .5];
var VIN = {x:-25, y:-31.5, w:50, h:37.5}, VOUT = {x:-30, y:-44, w:60, h:48}, VNEAR = {x:-12.8, y:-13.6, w:25.6, h:19.2};
function at(a, b, u){ return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }
function run(t0, pts, v){
  var k = [[t0, pts[0][0], pts[0][1]]], t = t0;
  for(var i = 1; i < pts.length; i++){ t += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]) / v; k.push([t, pts[i][0], pts[i][1]]); }
  return k;
}
function F(id, key, keys){ var p = FD.POS[key]; return {id:id, team:'red', label:key, glove:true, keys:keys || [[0, p.x, p.y]]}; }
function batter(num, t0, to, v){ return {id:'bat', team:'blue', label:String(num), keys:[[0, BAT[0], BAT[1]], [t0, BAT[0], BAT[1]]].concat(run(t0, [BAT].concat(to), v || 6.2).slice(1))}; }
var SWING = {t:.45, type:'swing', who:'bat', dur:.3};
var SCENES = [];

/* 1. 1루 세이프: 느린 땅볼, 타자가 먼저 */
(function(){
  var g = [-9.5, -20.5], tb = 3.75;
  SCENES.push({view:VIN, title:'느린 땅볼, 1루에서 누가 먼저?', answer:null,
    ex:'타자 주자가 1루를 밟은 뒤에 공이 1루수 글러브에 들어왔어요. 세이프!',
    dur:5.0, actors:[batter(3, .75, [[r + .1, -r + .1], [r + 2.2, -r + 2.2]], 6.4),
      F('ss', '1SS', [[0, -7.2, -22.2], [.5, -7.2, -22.2], [1.9, g[0] + .4, g[1] - .4]]),
      F('fb', '1B', [[0, 13.6, -14.6], [.8, 13.6, -14.6], [1.8, r + .3, -r - 1.0]]), F('s2', '2SS'), F('tb', '3B'), F('sb', '2B'), F('c', 'C')],
    ball:[{t0:.62, t1:2.1, from:'tee', to:g, kind:'roll', bounces:3, peak:1}, {t0:2.1, t1:2.75, on:'ss'}, {t0:2.75, t1:4.25, from:'ss', to:'fb', kind:'throw', peak:2.2}, {t0:4.25, t1:5, on:'fb'}],
    events:[SWING, {t:3.85, type:'base', base:'1', color:'#3fcf7f'}],
    marks:[{type:'text', x:r + 4.5, y:-r - 4.2, text:'발이 먼저', color:'#a9f0c4', at:3.85}, {type:'ring', x:B1[0], y:B1[1], r:2.2, color:'#3fcf7f', at:3.85}]});
})();

/* 2. 1루 포스아웃 */
(function(){
  var g = [5.2, -17.6];
  SCENES.push({view:VIN, title:'2루수 앞 땅볼', answer:'force',
    ex:'타자는 1루로 꼭 가야 하니 1루는 포스예요. 공을 가진 1루수가 타자보다 먼저 1루를 밟았어요. 포스아웃!',
    dur:4.6, actors:[batter(6, .75, [[r - 3.4, -r + 3.4], [r - 2.6, -r + 2.6]], 6.2),
      F('sb', '2B', [[0, 7.2, -22.2], [.5, 7.2, -22.2], [1.3, g[0] + .4, g[1] - .6]]),
      F('fb', '1B', [[0, 13.6, -14.6], [.8, 13.6, -14.6], [1.7, r + .3, -r - 1.0]]), F('s2', '2SS'), F('ss', '1SS'), F('tb', '3B'), F('c', 'C')],
    ball:[{t0:.62, t1:1.4, from:'tee', to:g, kind:'ground', bounces:3, peak:1.3}, {t0:1.4, t1:1.7, on:'sb'}, {t0:1.7, t1:2.2, from:'sb', to:'fb', kind:'throw'}, {t0:2.2, t1:4.6, on:'fb'}],
    events:[SWING, {t:2.25, type:'base', base:'1', color:'#ff6b52'}],
    marks:[{type:'force', bases:['1'], at:0}, {type:'text', x:r - 6, y:-r + 7, text:'아직 달리는 중', color:'#ffb4a6', at:2.2}]});
})();

/* 3. 2루 주자, 3루에서 베이스만 밟음 (포스 아님) → 세이프 */
(function(){
  var g = [-5.8, -17.4], tp = at(B2, B3, (2.75 - .65) / 3.05);
  SCENES.push({view:VIN, title:'3루수가 공을 잡고 3루를 밟았어요', answer:null,
    ex:'1루가 비어 있었으니 2루 주자는 3루로 꼭 가야 하는 상황(포스)이 아니에요. 베이스를 밟는 것만으로는 아웃이 아니고, 주자를 태그해야 해요. 세이프!',
    dur:4.8, actors:[batter(2, .75, [[r + .1, -r + .1]], 6.2),
      {id:'r2', team:'blue', label:'주자', keys:[[0, .4, B2[1]], [.65, .4, B2[1]]].concat(run(.65, [[.4, B2[1]], [B3[0] + .3, B3[1]]], 6).slice(1))},
      F('ss', '1SS', [[0, -7.2, -22.2], [.5, -7.2, -22.2], [1.4, g[0] - .3, g[1] - .7]]),
      F('tb', '3B', [[0, -13.6, -14.6], [.8, -13.6, -14.6], [1.7, B3[0] - .3, B3[1] - 1.1]]), F('fb', '1B'), F('sb', '2B'), F('s2', '2SS'), F('c', 'C')],
    ball:[{t0:.62, t1:1.45, from:'tee', to:g, kind:'ground', bounces:3, peak:1.3}, {t0:1.45, t1:1.75, on:'ss'}, {t0:1.75, t1:2.25, from:'ss', to:'tb', kind:'throw'}, {t0:2.25, t1:4.8, on:'tb'}],
    events:[SWING, {t:2.3, type:'base', base:'3', color:'#ffd23f'}, {t:2.4, type:'say', who:'tb', text:'밟았다!', dur:1.2}],
    marks:[{type:'text', x:-6, y:-28.8, text:'1루가 비어 있음 → 포스 아님', color:'#fff', at:0}]});
})();

/* 4. 태그아웃 */
(function(){
  var g = [-5.8, -17.4], tp = at(B2, B3, (2.6 - .65) / 3.05);
  SCENES.push({view:VIN, title:'3루로 달리는 2루 주자', answer:'tag',
    ex:'포스 상황이 아니어서 3루수가 공을 쥔 글러브로 베이스 밖의 주자를 직접 터치했어요. 태그아웃!',
    dur:4.4, actors:[batter(5, .75, [[r + .1, -r + .1]], 6.2),
      {id:'r2', team:'blue', label:'주자', keys:[[0, .4, B2[1]], [.65, .4, B2[1]], [2.6, tp[0], tp[1]], [2.9, tp[0] - .2, tp[1] + .1]]},
      F('ss', '1SS', [[0, -7.2, -22.2], [.5, -7.2, -22.2], [1.4, g[0] - .3, g[1] - .7]]),
      F('tb', '3B', [[0, -13.6, -14.6], [.8, -13.6, -14.6], [1.6, -12.3, -14.0], [2.3, -12.3, -14.0], [2.6, tp[0] - 1.1, tp[1] + 1.0]]), F('fb', '1B'), F('sb', '2B'), F('s2', '2SS'), F('c', 'C')],
    ball:[{t0:.62, t1:1.45, from:'tee', to:g, kind:'ground', bounces:3, peak:1.3}, {t0:1.45, t1:1.75, on:'ss'}, {t0:1.75, t1:2.25, from:'ss', to:'tb', kind:'throw'}, {t0:2.25, t1:4.4, on:'tb'}],
    events:[SWING, {t:2.6, type:'ring', who:'r2', until:4.4, color:'#ff6b52'}],
    marks:[{type:'ring', x:tp[0] - .5, y:tp[1] + .5, r:2.4, color:'#ff6b52', at:2.6}, {type:'text', x:tp[0] + 1, y:tp[1] - 3.2, text:'터치!', color:'#ffb4a6', at:2.6}]});
})();

/* 5. 홈 포스아웃 */
(function(){
  var g = [2.4, -12.4], hp = at(B3, BH, (2.35 - .65) / 3.05);
  SCENES.push({view:{x:-22, y:-27, w:44, h:33}, title:'3루 주자가 홈으로', answer:'force',
    ex:'티볼은 홈에서 충돌을 막으려고 홈을 언제나 포스아웃으로 판정해요. 공을 가진 본루수가 주자보다 먼저 홈을 밟았으니 아웃!',
    dur:4.4, actors:[batter(8, .75, [[6.5, -6.8]], 6.2),
      {id:'r3', team:'blue', label:'주자', keys:[[0, B3[0] - .2, B3[1] - .2], [.65, B3[0] - .2, B3[1] - .2], [2.35, hp[0], hp[1]], [2.9, hp[0] + .2, hp[1] + .4]]},
      F('s2', '2SS', [[0, 2.8, -15.4], [.55, 2.8, -15.4], [1.3, g[0] + .3, g[1] - .8]]), F('c', 'C', [[0, 0, 4.2], [.9, 0, 4.2], [1.6, .9, -.2]]), F('fb', '1B'), F('tb', '3B'), F('ss', '1SS')],
    ball:[{t0:.62, t1:1.35, from:'tee', to:g, kind:'ground', bounces:2, peak:1.1}, {t0:1.35, t1:1.7, on:'s2'}, {t0:1.7, t1:2.25, from:'s2', to:'c', kind:'throw'}, {t0:2.25, t1:4.4, on:'c'}],
    events:[SWING, {t:2.3, type:'base', base:'H', color:'#ff6b52'}],
    marks:[{type:'force', bases:['H'], at:0}]});
})();

/* 6. 주로 이탈 */
(function(){
  var g = [-3.0, -21.5], p0 = at(B2, B3, .35), out = [p0[0] - 2.2, p0[1] - 3.0];
  SCENES.push({view:VIN, title:'태그를 피하는 2루 주자', answer:'lane',
    ex:'태그를 피하려고 2루와 3루를 잇는 직선에서 1 m보다 훨씬 멀리 벗어났어요. 터치되지 않았어도 주자 아웃이에요.',
    dur:4.6, actors:[batter(1, .75, [[r + .1, -r + .1]], 6.2),
      {id:'r2', team:'blue', label:'주자', keys:[[0, .4, B2[1]], [.65, .4, B2[1]], [1.7, p0[0], p0[1]], [2.5, out[0], out[1]], [3.2, B3[0] - 1.8, B3[1] - 1.6]]},
      F('ss', '1SS', [[0, -7.2, -22.2], [.5, -7.2, -22.2], [1.2, g[0] - .4, g[1] - .4], [2.2, p0[0] + .2, p0[1] + 1.6]]),
      F('tb', '3B'), F('fb', '1B'), F('sb', '2B'), F('s2', '2SS'), F('c', 'C')],
    ball:[{t0:.62, t1:1.25, from:'tee', to:g, kind:'line', peak:1.2}, {t0:1.25, t1:4.6, on:'ss'}],
    events:[SWING, {t:2.0, type:'say', who:'r2', text:'피하자!', dur:1.2}, {t:2.6, type:'ring', who:'r2', until:4.6, color:'#ff6b52'}],
    marks:[{type:'lane', from:'2', to:'3', at:0}]});
})();

/* 7. 루반칙 */
SCENES.push({view:VIN, title:'1루 주자의 출발', answer:'early',
  ex:'타자가 공을 치기 전에 1루 주자가 베이스를 떠났어요. 티볼에는 도루가 없어서 루반칙으로 주자 아웃, 경기가 멈춰요.',
  dur:3.0, actors:[{id:'bat', team:'blue', label:'4', keys:[[0, BAT[0], BAT[1]]]},
    {id:'r1', team:'blue', label:'주자', keys:[[0, B1[0] + .2, B1[1] - .2], [.25, B1[0] + .2, B1[1] - .2], [1.25, 9.4, -15.8], [1.6, 9.0, -16.2]]},
    F('fb', '1B'), F('sb', '2B'), F('s2', '2SS'), F('ss', '1SS'), F('tb', '3B'), F('c', 'C')],
  ball:[{t0:0, t1:1.0, from:'tee', to:'tee', kind:'line', peak:0, h0:.7, h1:.7}, {t0:1.0, t1:1.8, from:'tee', to:[1.5, -16], kind:'ground', bounces:2, peak:1.2}],
  events:[{t:.85, type:'swing', who:'bat', dur:.3}],
  marks:[{type:'text', x:B1[0] + 3.6, y:B1[1] + 2.4, text:'치기 전에 떠남', color:'#ffb4a6', at:0}, {type:'ring', x:B1[0], y:B1[1], r:2, color:'#ff6b52', at:0}]});

/* 8. 슬라이딩 */
(function(){
  var g = [-14, -34];
  SCENES.push({view:VIN, title:'2루로 뛰어드는 주자', answer:'slide',
    ex:'공보다 먼저 들어왔지만 슬라이딩을 했어요. 티볼은 다치지 않도록 슬라이딩을 금지해서, 슬라이딩한 주자는 아웃이에요.',
    dur:4.6, actors:[batter(7, .75, [[r + .1, -r + .1]], 6.2),

<script>
try{
(function(){
  var cur = 0, scene = null, board = null, phase = 'watch', pick = null, res = {};
  var svgHost = document.getElementById('pitch');
  var prog = document.getElementById('prog');
  prog.innerHTML = SCENES.map(function(){ return '<i></i>'; }).join('');
  var rs = document.getElementById('reasons');
  rs.innerHTML = Object.keys(REASONS).map(function(k){ return '<button data-r="' + k + '">' + REASONS[k] + '</button>'; }).join('');
  function $(id){ return document.getElementById(id); }
  function ui(){
    $('sNo').textContent = (cur + 1) + ' / ' + SCENES.length;
    var ok = 0; for(var k in res) if(res[k]) ok++;
    $('sOk').textContent = ok;
    Array.prototype.forEach.call(prog.children, function(d, i){ d.className = (i === cur ? 'on ' : '') + (i in res ? (res[i] ? 'ok' : 'no') : ''); });
  }
  function load(i){
    cur = i; phase = 'watch'; pick = null;
    var s = SCENES[i];
    var fresh = svgHost.cloneNode(false); svgHost.parentNode.replaceChild(fresh, svgHost); svgHost = fresh;
    board = new FD.Field(svgHost, {view:s.view, labels:false});
    scene = new FD.Scene(board, s, {onEnd:function(){ enable(true); }}); window.SCN = scene;
    $('hNo').textContent = i + 1; $('hTitle').textContent = s.title;
    $('step1').style.display = ''; $('step2').style.display = 'none'; $('result').style.display = 'none';
    Array.prototype.forEach.call(document.querySelectorAll('.dec'), function(b){ b.classList.remove('sel'); });
    Array.prototype.forEach.call(rs.children, function(b){ b.classList.remove('sel'); b.disabled = false; });
    $('bMarks').disabled = true; $('bMarks').classList.remove('on');
    enable(false);
    ui();
    setTimeout(function(){ play(1); }, 500);
  }
  function enable(on){ Array.prototype.forEach.call(document.querySelectorAll('.dec'), function(b){ b.disabled = !on || phase !== 'watch'; }); }
  function play(sp){ scene.t = 0; scene.play(sp); $('spd').textContent = sp < 1 ? '느리게 ×' + sp : ''; }
  $('bReplay').onclick = function(){ play(1); };
  $('bSlow').onclick = function(){ play(.4); };
  $('bMarks').onclick = function(){ var on = !this.classList.contains('on'); this.classList.toggle('on', on); scene.setMarks(on); };
  Array.prototype.forEach.call(document.querySelectorAll('.dec'), function(b){
    b.onclick = function(){
      if(phase !== 'watch') return;
      Array.prototype.forEach.call(document.querySelectorAll('.dec'), function(x){ x.classList.toggle('sel', x === b); });
      if(b.dataset.d === 'play'){ judge(null); }
      else { phase = 'reason'; $('step2').style.display = ''; enable(false); }
    };
  });
  Array.prototype.forEach.call(rs.children, function(b){
    b.onclick = function(){
      if(phase !== 'reason') return;
      b.classList.add('sel');
      judge(b.dataset.r);
    };
  });
  function judge(call){
    phase = 'done'; enable(false);
    Array.prototype.forEach.call(rs.children, function(b){ b.disabled = true; });
    var s = SCENES[cur], ok = call === s.answer;
    if(!(cur in res)) res[cur] = ok;
    var ans = !s.answer ? '세이프 · 페어 → 경기 계속' : s.answer === 'foul' ? '파울 → 스트라이크 하나, 주자는 원래 베이스로' : '아웃: ' + REASONS[s.answer];
    var r = $('result');
    r.innerHTML = '<div class="verdict"><span class="mark ' + (ok ? 'ok' : 'no') + '">' + (ok ? '정확한 판정!' : '아쉬운 판정') + '</span></div>' +
      '<div class="ans ' + (s.answer ? 'foul' : 'ok') + '">' + ans + '</div><p>' + s.ex + '</p>' +
      '<div class="acts"><button class="btn" id="why">느린 화면으로 이유 보기</button><button class="btn volt" id="next">' + (cur < SCENES.length - 1 ? '다음 장면 →' : '결과 보기 →') + '</button></div>';
    r.style.display = '';
    $('bMarks').disabled = false; $('bMarks').classList.add('on');
    scene.setMarks(true);
    play(.45);
    $('why').onclick = function(){ scene.setMarks(true); $('bMarks').classList.add('on'); play(.45); };
    $('next').onclick = function(){ if(cur < SCENES.length - 1) load(cur + 1); else final(); };
    ui();
    r.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  function final(){
    var ok = 0; for(var k in res) if(res[k]) ok++;
    var n = SCENES.length;
    var rank = ok >= n - 1 ? '주심 자격 충분!' : ok >= Math.ceil(n * .7) ? '믿음직한 부심' : '심판 연습생';
    var miss = SCENES.map(function(s, i){ return i; }).filter(function(i){ return !res[i]; });
    $('finalIn').innerHTML = '<div class="kicker">판정 결과</div><div class="rank">' + rank + '</div>' +
      '<div class="scorebox"><div><div class="lbl">정확한 판정</div><div class="digits">' + ok + '<small> / ' + n + '</small></div></div><div style="flex:1;min-width:220px"><div class="msg">심판은 공과 주자 중 무엇이 먼저 베이스에 닿았는지, 그 베이스가 포스인지, 공이 어디에 멈췄는지를 봐요. 수업 경기에서 우리가 직접 판정할 때도 이 세 가지를 기억해요.</div></div></div>' +
      (miss.length ? '<h3>다시 볼 장면</h3><div class="review">' + miss.map(function(i){ return '<button data-i="' + i + '">장면 ' + (i+1) + ' · ' + SCENES[i].title + ' →</button>'; }).join('') + '</div>' : '') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn ghost" id="again">처음부터 다시</button><button class="btn volt" data-nav="science">05 경기장 밖 과학으로 →</button></div>';
    $('final').classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('#finalIn [data-i]'), function(b){ b.onclick = function(){ $('final').classList.remove('on'); load(+b.dataset.i); }; });
    $('again').onclick = function(){ res = {}; $('final').classList.remove('on'); load(0); };
  }
  load(0);
})();
}catch(e){ PE_ERR(e, '내가 심판'); }
</script>
